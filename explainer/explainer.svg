<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="297.0mm" height="210.0mm" viewBox="0 0 297.0 210.0">
  <rect width="297.0" height="210.0" fill="#ffffff"/>
  <text x="16.00" y="24.00" font-family="FreeSans, DejaVu Sans, sans-serif" font-size="13" fill="#14161a" font-weight="bold" text-anchor="start" letter-spacing="0.6">MARGADARSHAK</text>
  <text x="16.00" y="32.50" font-family="FreeSans, DejaVu Sans, sans-serif" font-size="4.0" fill="#5b6472" font-weight="normal" text-anchor="start">मार्गदर्शक — the one who shows the way</text>
  <text x="16.00" y="42.00" font-family="FreeSans, DejaVu Sans, sans-serif" font-size="4.6" fill="#14161a" font-weight="normal" text-anchor="start">A wheelchair that takes airport passengers to their gate by itself, for a fraction of what the imported ones cost.</text>
  <path d="M16.00,48.00 L281.00,48.00" stroke="#dfe4ea" stroke-width="0.4" fill="none"/>
  <path d="M8.24,146.00 L120.24,146.00" stroke="#c9d4e4" stroke-width="0.5" fill="none"/>
  <rect x="18.88" y="58.64" width="3.92" height="36.96" rx="0" fill="#e8eef7" stroke="#14161a" stroke-width="0.45"/>
  <path d="M22.80,120.24 L22.80,81.04 L62.00,81.04 L62.00,97.84 L90.00,97.84 L90.00,120.24 Z" fill="#f4f7fb" stroke="#14161a" stroke-width="0.5"/>
  <path d="M22.80,95.60 L62.00,95.60" stroke="#c9d4e4" stroke-width="0.5" fill="none"/>
  <rect x="17.20" y="120.24" width="89.60" height="2.24" rx="0" fill="#ffffff" stroke="#14161a" stroke-width="0.45"/>
  <path d="M91.68,122.48 L91.68,130.32" stroke="#14161a" stroke-width="0.35" fill="none"/>
  <rect x="90.00" y="130.32" width="11.20" height="2.24" rx="0" fill="#ffffff" stroke="#14161a" stroke-width="0.45"/>
  <path d="M40.72,93.36 L35.68,63.12" fill="none" stroke="#5b6472" stroke-width="1.344" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M40.72,93.36 L74.32,93.36 L91.12,124.72" fill="none" stroke="#5b6472" stroke-width="1.344" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M36.80,70.96 L57.52,79.92" fill="none" stroke="#5b6472" stroke-width="1.0080000000000002" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="34.00" cy="57.52" r="5.04" fill="#ffffff" stroke="#5b6472" stroke-width="0.5"/>
  <circle cx="50.80" cy="127.80" r="18.20" fill="#ffffff" stroke="#14161a" stroke-width="0.6"/>
  <path d="M35.15,127.80 L66.45,127.80" stroke="#c9d4e4" stroke-width="0.3" fill="none"/>
  <path d="M37.24,119.97 L64.36,135.63" stroke="#c9d4e4" stroke-width="0.3" fill="none"/>
  <path d="M42.97,114.24 L58.63,141.36" stroke="#c9d4e4" stroke-width="0.3" fill="none"/>
  <path d="M50.80,112.15 L50.80,143.45" stroke="#c9d4e4" stroke-width="0.3" fill="none"/>
  <path d="M58.63,114.24 L42.97,141.36" stroke="#c9d4e4" stroke-width="0.3" fill="none"/>
  <path d="M64.36,119.97 L37.24,135.63" stroke="#c9d4e4" stroke-width="0.3" fill="none"/>
  <circle cx="50.80" cy="127.80" r="2.91" fill="#ffffff" stroke="#14161a" stroke-width="0.4"/>
  <circle cx="86.64" cy="140.96" r="5.04" fill="#ffffff" stroke="#14161a" stroke-width="0.45"/>
  <rect x="104.56" y="118.00" width="2.24" height="26.32" rx="0" fill="#ffffff" stroke="#1c5cab" stroke-width="0.5"/>
  <path d="M8.24,147.50 L120.24,147.50" stroke="#1c5cab" stroke-width="1.2" fill="none" stroke-dasharray="2.4,1.6"/>
  <text x="8.24" y="152.00" font-family="FreeSans, DejaVu Sans, sans-serif" font-size="2.9" fill="#1c5cab" font-weight="normal" text-anchor="start">the guide line it follows, laid into the floor</text>
  <text x="16.00" y="163.00" font-family="FreeSans, DejaVu Sans, sans-serif" font-size="3.6" fill="#14161a" font-weight="bold" text-anchor="start">The demonstrator</text>
  <text x="16.00" y="169.00" font-family="FreeSans, DejaVu Sans, sans-serif" font-size="3.2" fill="#5b6472" font-weight="normal" text-anchor="start">1:6 scale, 4 mm MDF, two chairs for ₹4,759.</text>
  <text x="16.00" y="173.60" font-family="FreeSans, DejaVu Sans, sans-serif" font-size="3.2" fill="#5b6472" font-weight="normal" text-anchor="start">Drive wheels double as the wheelchair's own.</text>
  <text x="128.00" y="60.00" font-family="FreeSans, DejaVu Sans, sans-serif" font-size="3.4" fill="#1c5cab" font-weight="bold" text-anchor="start" letter-spacing="0.5">THE PROBLEM</text>
  <text x="128.00" y="67.50" font-family="FreeSans, DejaVu Sans, sans-serif" font-size="3.4" fill="#5b6472" font-weight="normal" text-anchor="start">Indian airports must provide wheelchair assistance free, and</text>
  <text x="128.00" y="72.10" font-family="FreeSans, DejaVu Sans, sans-serif" font-size="3.4" fill="#5b6472" font-weight="normal" text-anchor="start">do not have the attendants to do it. Passengers wait without</text>
  <text x="128.00" y="76.70" font-family="FreeSans, DejaVu Sans, sans-serif" font-size="3.4" fill="#5b6472" font-weight="normal" text-anchor="start">knowing how long. Delivered to a gate, they are stranded there</text>
  <text x="128.00" y="81.30" font-family="FreeSans, DejaVu Sans, sans-serif" font-size="3.4" fill="#5b6472" font-weight="normal" text-anchor="start">until somebody remembers them. And when the airline moves</text>
  <text x="128.00" y="85.90" font-family="FreeSans, DejaVu Sans, sans-serif" font-size="3.4" fill="#5b6472" font-weight="normal" text-anchor="start">the gate, nobody tells the person pushing the chair.</text>
  <text x="128.00" y="100.00" font-family="FreeSans, DejaVu Sans, sans-serif" font-size="3.4" fill="#1c5cab" font-weight="bold" text-anchor="start" letter-spacing="0.5">HOW IT WORKS</text>
  <circle cx="130.40" cy="106.80" r="2.60" fill="#eef4fc" stroke="#1c5cab" stroke-width="0.4"/>
  <text x="130.40" y="108.00" font-family="FreeSans, DejaVu Sans, sans-serif" font-size="3.2" fill="#1c5cab" font-weight="bold" text-anchor="middle">1</text>
  <text x="136.00" y="106.40" font-family="FreeSans, DejaVu Sans, sans-serif" font-size="3.6" fill="#14161a" font-weight="bold" text-anchor="start">The passenger scans their boarding pass.</text>
  <text x="136.00" y="111.00" font-family="FreeSans, DejaVu Sans, sans-serif" font-size="3.2" fill="#5b6472" font-weight="normal" text-anchor="start">Nothing to type, nothing to read, no app.</text>
  <circle cx="130.40" cy="119.80" r="2.60" fill="#eef4fc" stroke="#1c5cab" stroke-width="0.4"/>
  <text x="130.40" y="121.00" font-family="FreeSans, DejaVu Sans, sans-serif" font-size="3.2" fill="#1c5cab" font-weight="bold" text-anchor="middle">2</text>
  <text x="136.00" y="119.40" font-family="FreeSans, DejaVu Sans, sans-serif" font-size="3.6" fill="#14161a" font-weight="bold" text-anchor="start">A laptop in the airport finds the gate.</text>
  <text x="136.00" y="124.00" font-family="FreeSans, DejaVu Sans, sans-serif" font-size="3.2" fill="#5b6472" font-weight="normal" text-anchor="start">The pass names the flight; the gate is looked up live.</text>
  <circle cx="130.40" cy="132.80" r="2.60" fill="#eef4fc" stroke="#1c5cab" stroke-width="0.4"/>
  <text x="130.40" y="134.00" font-family="FreeSans, DejaVu Sans, sans-serif" font-size="3.2" fill="#1c5cab" font-weight="bold" text-anchor="middle">3</text>
  <text x="136.00" y="132.40" font-family="FreeSans, DejaVu Sans, sans-serif" font-size="3.6" fill="#14161a" font-weight="bold" text-anchor="start">The chair follows a line in the floor.</text>
  <text x="136.00" y="137.00" font-family="FreeSans, DejaVu Sans, sans-serif" font-size="3.2" fill="#5b6472" font-weight="normal" text-anchor="start">No map, no cloud. It stops for anything in front of it.</text>
  <rect x="128.00" y="150.00" width="153.00" height="20.00" rx="1.5" fill="#eef4fc" stroke="#1c5cab" stroke-width="0.4"/>
  <text x="133.00" y="157.50" font-family="FreeSans, DejaVu Sans, sans-serif" font-size="3.9" fill="#14161a" font-weight="bold" text-anchor="start">If the gate changes mid-journey, the chair is simply re-routed.</text>
  <text x="133.00" y="163.50" font-family="FreeSans, DejaVu Sans, sans-serif" font-size="3.2" fill="#5b6472" font-weight="normal" text-anchor="start">A person pushing a wheelchair cannot do that. They set off committed, and nobody tells them.</text>
  <path d="M16.00,182.00 L281.00,182.00" stroke="#dfe4ea" stroke-width="0.4" fill="none"/>
  <text x="16.00" y="190.00" font-family="FreeSans, DejaVu Sans, sans-serif" font-size="5.0" fill="#1c5cab" font-weight="bold" text-anchor="start">₹4,759</text>
  <text x="16.00" y="195.00" font-family="FreeSans, DejaVu Sans, sans-serif" font-size="3.0" fill="#5b6472" font-weight="normal" text-anchor="start">two working chairs</text>
  <text x="82.25" y="190.00" font-family="FreeSans, DejaVu Sans, sans-serif" font-size="5.0" fill="#1c5cab" font-weight="bold" text-anchor="start">4 languages</text>
  <text x="82.25" y="195.00" font-family="FreeSans, DejaVu Sans, sans-serif" font-size="3.0" fill="#5b6472" font-weight="normal" text-anchor="start">Konkani first, English last</text>
  <text x="148.50" y="190.00" font-family="FreeSans, DejaVu Sans, sans-serif" font-size="5.0" fill="#1c5cab" font-weight="bold" text-anchor="start">No cloud</text>
  <text x="148.50" y="195.00" font-family="FreeSans, DejaVu Sans, sans-serif" font-size="3.0" fill="#5b6472" font-weight="normal" text-anchor="start">nothing leaves the airport</text>
  <text x="214.75" y="190.00" font-family="FreeSans, DejaVu Sans, sans-serif" font-size="5.0" fill="#1c5cab" font-weight="bold" text-anchor="start">338 tests</text>
  <text x="214.75" y="195.00" font-family="FreeSans, DejaVu Sans, sans-serif" font-size="3.0" fill="#5b6472" font-weight="normal" text-anchor="start">the dispatcher runs today</text>
  <text x="281.00" y="203.00" font-family="FreeSans, DejaVu Sans, sans-serif" font-size="2.9" fill="#5b6472" font-weight="normal" text-anchor="end">Nothing here has yet carried a passenger. The hardware is designed and not built.</text>
</svg>
