  <text x="320.00" y="194.60" font-family="sans-serif" font-size="2.8" fill="#1c5cab" text-anchor="middle" font-weight="normal">deck 110</text>
  <text x="240.00" y="208.00" font-family="sans-serif" font-size="4.2" fill="#1c5cab" text-anchor="start" font-weight="bold">FRONT ELEVATION</text>
  <text x="240.00" y="213.00" font-family="sans-serif" font-size="2.6" fill="#86b6ef" text-anchor="start" font-weight="normal">backrest shown light, behind the seat</text>
  <text x="18.00" y="222.00" font-family="sans-serif" font-size="3.0" fill="#1c5cab" text-anchor="start" font-weight="bold">CRITICAL DIMENSIONS</text>
  <text x="18.00" y="225.90" font-family="sans-serif" font-size="2.7" fill="#86b6ef" text-anchor="start" font-weight="normal">Ride height is set by the wheel: 65 mm dia gives a 42 mm deck underside.</text>
  <text x="18.00" y="229.80" font-family="sans-serif" font-size="2.7" fill="#86b6ef" text-anchor="start" font-weight="normal">A different wheel changes everything above it. Edit WHEEL_DIA and re-run both generators.</text>
  <text x="18.00" y="233.70" font-family="sans-serif" font-size="2.7" fill="#86b6ef" text-anchor="start" font-weight="normal">Line sensor adjusts 9–25 mm above the floor, by sliding in its slots.</text>
  <text x="18.00" y="237.60" font-family="sans-serif" font-size="2.7" fill="#86b6ef" text-anchor="start" font-weight="normal">Set it on the real track surface, not on the bench.</text>
  <text x="18.00" y="245.40" font-family="sans-serif" font-size="3.0" fill="#1c5cab" text-anchor="start" font-weight="bold">ASSEMBLY</text>
  <text x="18.00" y="249.30" font-family="sans-serif" font-size="2.7" fill="#86b6ef" text-anchor="start" font-weight="normal">1  Castor and riser first. Check the deck sits level on the wheels before anything else.</text>
  <text x="18.00" y="253.20" font-family="sans-serif" font-size="2.7" fill="#86b6ef" text-anchor="start" font-weight="normal">2  Motors, zip-tied tight. A motor that can rotate in its mount makes the line following</text>
  <text x="18.00" y="257.10" font-family="sans-serif" font-size="2.7" fill="#86b6ef" text-anchor="start" font-weight="normal">   untunable, and you will blame the PID for a week.</text>
  <text x="18.00" y="261.00" font-family="sans-serif" font-size="2.7" fill="#86b6ef" text-anchor="start" font-weight="normal">3  Side panels with gussets inside the corners, square to the deck.</text>
  <text x="18.00" y="264.90" font-family="sans-serif" font-size="2.7" fill="#86b6ef" text-anchor="start" font-weight="normal">4  Seat cleats inside the panels, then the seat pan, then the backrest.</text>
  <text x="18.00" y="268.80" font-family="sans-serif" font-size="2.7" fill="#86b6ef" text-anchor="start" font-weight="normal">5  Sensor bracket last, screws left loose until the sensor height is set.</text>
  <text x="18.00" y="276.60" font-family="sans-serif" font-size="2.7" fill="#86b6ef" text-anchor="start" font-weight="normal">Dry-fit the whole body with tape before any glue. MDF and wood glue give you ten seconds.</text>
  <rect x="250.00" y="232.00" width="158.00" height="51.00" fill="none" stroke="#1c5cab" stroke-width="0.5"/>
  <path d="M250.00,241.00 L408.00,241.00" stroke="#1c5cab" stroke-width="0.35" fill="none"/>
  <text x="252.00" y="238.50" font-family="sans-serif" font-size="3.4" fill="#1c5cab" text-anchor="start" font-weight="bold">MARGADARSHAK — GUIDED ASSISTIVE CHAIR, SCALE DEMONSTRATOR</text>
  <text x="252.00" y="247.00" font-family="sans-serif" font-size="2.8" fill="#86b6ef" text-anchor="start" font-weight="normal">Scale</text>
  <text x="276.00" y="247.00" font-family="sans-serif" font-size="2.8" fill="#1c5cab" text-anchor="start" font-weight="normal">1:1 on A3.  The model is 1:6 of a real wheelchair.</text>
  <text x="252.00" y="252.20" font-family="sans-serif" font-size="2.8" fill="#86b6ef" text-anchor="start" font-weight="normal">Material</text>
  <text x="276.00" y="252.20" font-family="sans-serif" font-size="2.8" fill="#1c5cab" text-anchor="start" font-weight="normal">4 mm MDF throughout, except the wheels and castor.</text>
  <text x="252.00" y="257.40" font-family="sans-serif" font-size="2.8" fill="#86b6ef" text-anchor="start" font-weight="normal">Units</text>
  <text x="276.00" y="257.40" font-family="sans-serif" font-size="2.8" fill="#1c5cab" text-anchor="start" font-weight="normal">Millimetres. Heights are above the floor.</text>
  <text x="252.00" y="262.60" font-family="sans-serif" font-size="2.8" fill="#86b6ef" text-anchor="start" font-weight="normal">Drive</text>
  <text x="276.00" y="262.60" font-family="sans-serif" font-size="2.8" fill="#1c5cab" text-anchor="start" font-weight="normal">2 × BO geared motor, 65 mm wheels, differential, castor at the front.</text>
  <text x="252.00" y="267.80" font-family="sans-serif" font-size="2.8" fill="#86b6ef" text-anchor="start" font-weight="normal">Mass</text>
  <text x="276.00" y="267.80" font-family="sans-serif" font-size="2.8" fill="#1c5cab" text-anchor="start" font-weight="normal">≈ 600 g loaded.</text>
  <text x="252.00" y="273.00" font-family="sans-serif" font-size="2.8" fill="#86b6ef" text-anchor="start" font-weight="normal">Drawn from</text>
  <text x="276.00" y="273.00" font-family="sans-serif" font-size="2.8" fill="#1c5cab" text-anchor="start" font-weight="normal">generate_chassis.py and generate_mdf_body_template.py</text>
</svg>
